name: CI

on:
  push: { branches: [develop, main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: The committed OpenAPI document must be current
        run: |
          uv run dgxctl schema --out /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Generated types must match the API contract
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/types.gen.ts || \
            (echo "types.gen.ts is stale; run npm run gen:types" && exit 1)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
