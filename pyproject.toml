[project]
name = "dgxctl"
version = "0.1.0"
description = "Granular observability and safe control for NVIDIA DGX Spark systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=5.9",
    "docker>=7.1",
    "httpx>=0.27",
    "typer>=0.12",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "anyio>=4"]

[project.scripts]
dgxctl = "dgxctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgxctl"]

[tool.hatch.build.targets.wheel.force-include]
"catalog/default.toml" = "dgxctl/_data/catalog_default.toml"
"deploy/dgxctl.service" = "dgxctl/_data/dgxctl.service"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
# The live-verification script talks to a known loopback URL and compares literal bind
# addresses; the security lints it trips are about the strings it inspects, not what it does.
"scripts/live_verify.py" = ["S104", "S310"]
